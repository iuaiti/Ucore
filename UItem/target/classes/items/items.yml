items:
  fire_blade:
    material: DIAMOND_SWORD
    display-name: "<red><bold>Fire Blade"
    lore:
      - "<gray>A legendary fire blade"
      - "<gray>Burns all enemies"
      - "<dark_gray>---"
      - "<red>Right-Click: <white>Launch Fireball <dark_gray>(5s cd)"
      - "<gold>On Hit: <white>30% chance to ignite"
    enchantments:
      sharpness: 5
      fire_aspect: 2
    flags:
      - HIDE_ENCHANTS
    custom-model-data: 10001
    unbreakable: true
    glowing: false
    rarity: EPIC
    skills:
      fireball:
        trigger: RIGHT_CLICK
        cooldown: 5.0
        cancel-event: true
        actions:
          a0:
            type: SHOOT_PROJECTILE
            projectile: FIREBALL
            speed: 1.5
            damage: 8.0
          a1:
            type: PLAY_SOUND
            sound: ENTITY_BLAZE_SHOOT
            volume: 1.0
            pitch: 1.0
          a2:
            type: SPAWN_PARTICLE
            particle: FLAME
            count: 15
      ignite_on_hit:
        trigger: HIT
        chance: 30.0
        cooldown: 1.0
        actions:
          a0:
            type: SET_FIRE
            seconds: 3

  ice_ender:
    material: NETHERITE_SWORD
    display-name: "<aqua><bold>Ice Ender"
    lore:
      - "<gray>Eternal frost"
      - "<dark_gray>---"
      - "<aqua>Right-Click: <white>Ice Prison on target <dark_gray>(10s cd)"
      - "<blue>Shift+Right: <white>Blink forward 6 blocks"
    enchantments:
      sharpness: 7
      unbreaking: 5
    custom-model-data: 10002
    rarity: LEGENDARY
    skills:
      ice_prison:
        trigger: RIGHT_CLICK
        cooldown: 10.0
        cancel-event: true
        actions:
          a0:
            type: ICE_PRISON
            duration: 3
          a1:
            type: PLAY_SOUND
            sound: BLOCK_GLASS_PLACE
            volume: 0.8
            pitch: 0.5
      blink:
        trigger: SHIFT_RIGHT_CLICK
        cooldown: 6.0
        cancel-event: true
        actions:
          a0:
            type: BLINK
            distance: 6.0

  healing_staff:
    material: BLAZE_ROD
    display-name: "<green><bold>Healing Staff"
    lore:
      - "<gray>Healing staff"
      - "<dark_gray>---"
      - "<green>Right-Click: <white>Heal 6 HP <dark_gray>(8s cd)"
      - "<aqua>Shift+Right: <white>Healing circle around you"
    rarity: RARE
    skills:
      heal_self:
        trigger: RIGHT_CLICK
        cooldown: 8.0
        cancel-event: true
        actions:
          a0:
            type: HEAL
            amount: 6.0
          a1:
            type: PLAY_SOUND
            sound: ENTITY_PLAYER_LEVELUP
            volume: 0.6
            pitch: 1.4
          a2:
            type: SPAWN_PARTICLE
            particle: HAPPY_VILLAGER
            count: 20
      heal_area:
        trigger: SHIFT_RIGHT_CLICK
        cooldown: 15.0
        cancel-event: true
        actions:
          a0:
            type: HEALING_CIRCLE
            heal: 4.0
            radius: 5.0
          a1:
            type: PLAY_SOUND
            sound: BLOCK_BEACON_ACTIVATE
            volume: 0.7
            pitch: 1.2

  venom_dagger:
    material: IRON_SWORD
    display-name: "<dark_green><bold>Venom Dagger"
    lore:
      - "<gray>A blade coated in deadly venom"
      - "<dark_green>Chance for extra damage on hit"
      - "<gray>Extra damage scales"
    enchantments:
      sharpness: 2
    flags:
      - HIDE_ENCHANTS
    custom-model-data: 10050
    rarity: RARE
    effects:
      e0:
        trigger: HIT
        type: EXTRA_DAMAGE
        value: 2.0
        chance: 40

  plague_staff:
    material: BLAZE_ROD
    display-name: "<dark_purple><bold>Plague Staff"
    lore:
      - "<gray>Ancient staff of pestilence"
      - "<dark_green>Chance to apply damage over time on hit"
    rarity: LEGENDARY
    effects:
      e0:
        trigger: HIT
        type: EXTRA_DAMAGE
        value: 1.5
        chance: 60

  # Example armor set piece (effects use REFLECT/EXTRA only)
  # You can make helmet/chest/legs/boots all have FULL_SET effects for set bonuses (reflect/extra on damage triggers)
  shadow_helmet:
    material: NETHERITE_HELMET
    display-name: "<dark_purple><bold>Shadow Helmet</bold>"
    lore:
      - "<gray>Part of the Shadow Set"
      - "<dark_gray>When full set worn: grants bonuses via effects"
    rarity: LEGENDARY
    effects:
      e0:
        trigger: DAMAGE
        type: REFLECT
        value: 15.0
        chance: 100

  # Example weapon with hit effects
  thunder_sword:
    material: DIAMOND_SWORD
    display-name: "<yellow><bold>Thunder Blade</bold>"
    lore:
      - "<gray>Chance to strike with lightning on hit"
    rarity: EPIC
    # Example of flexible model mapping (Oraxen/ItemsAdder style)
    # You can drop ANY .json (even from ItemsAdder) into plugins/UItem/models/
    # and map it with "model:". Filename does not need to match item ID.
    # For ItemsAdder models: model: "itemsadder:item/the_name_from_ia"
    model: "thunder_sword"   # looks for models/thunder_sword.json
    # model: "itemsadder:item/some_ia_model"  # example for IA models
    effects:
      e0:
        trigger: HIT
        type: EXTRA_DAMAGE
        value: 4.0
        chance: 35
      e1:
        trigger: HIT
        type: REFLECT
        value: 10.0
        chance: 20
