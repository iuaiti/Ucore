# ─── Mana System ───
mana:
  # Base max mana (StatType.MANA from skill tree is added on top)
  base-max: 20

  # How many ticks between mana regen (20 ticks = 1 second)
  regen-interval-ticks: 20

  # HUD settings
  hud-enabled: true
  hud-interval-ticks: 20
  bar-length: 10
  fill-char: "█"
  empty-char: "░"
  color: "<aqua>"
  empty-color: "<dark_gray>"

  # Số spaces trailing để đẩy HUD về góc trái màn hình.
  # sendActionBar căn giữa → thêm trailing spaces dài sẽ dịch nội dung sang trái.
  # Tăng nếu vẫn quá giữa, giảm nếu bị đẩy quá trái. Mặc định 60.
  hud-padding: 60

  # Số spaces leading để đẩy notification (SP, XP...) sang góc PHẢI màn hình.
  # Đối xứng với mana HUD bên trái. Mặc định 60.
  notification-padding: 60

  # Message when not enough mana
  no-mana-message: "<red>Not enough mana! Need %s MP"

# ─── Skill XP Sources ────────────────────────────────────────────────────────
# SP kiếm được theo hoạt động. Daily cap = giới hạn SP/ngày theo nguồn.
skill-xp:
  # Giới hạn SP mỗi ngày theo nguồn (0 = không giới hạn)
  daily-caps:
    mob: 100
    mining: 50
    farming: 30
    fishing: 20
    enchanting: 30
    levelup: 50

  mining:
    enabled: true
    notify-color: "<yellow>"
    blocks:
      COAL_ORE: 1
      DEEPSLATE_COAL_ORE: 1
      IRON_ORE: 1
      DEEPSLATE_IRON_ORE: 1
      COPPER_ORE: 1
      DEEPSLATE_COPPER_ORE: 1
      REDSTONE_ORE: 1
      DEEPSLATE_REDSTONE_ORE: 1
      LAPIS_ORE: 2
      DEEPSLATE_LAPIS_ORE: 2
      GOLD_ORE: 2
      DEEPSLATE_GOLD_ORE: 2
      NETHER_GOLD_ORE: 2
      NETHER_QUARTZ_ORE: 1
      DIAMOND_ORE: 5
      DEEPSLATE_DIAMOND_ORE: 5
      EMERALD_ORE: 4
      DEEPSLATE_EMERALD_ORE: 4
      ANCIENT_DEBRIS: 8

  farming:
    enabled: true
    notify-color: "<green>"
    require-fully-grown: true
    crops:
      WHEAT: 1
      CARROTS: 1
      POTATOES: 1
      BEETROOTS: 1
      PUMPKIN: 1
      MELON: 1
      NETHER_WART: 2
      COCOA: 1
      SUGAR_CANE: 1
      BAMBOO: 1
      SWEET_BERRY_BUSH: 1
      CAVE_VINES_PLANT: 1
      CHORUS_FLOWER: 2
      PITCHER_PLANT: 2

  fishing:
    enabled: true
    notify-color: "<aqua>"
    fish: 1
    treasure: 3
    junk: 0

  enchanting:
    enabled: true
    notify-color: "<light_purple>"
    sp-per-5-levels: 1

  levelup:
    enabled: true
    notify-color: "<green>"
    sp-per-level: 1
